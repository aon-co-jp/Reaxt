[package]
name = "reaxt-actions"
description = "Reaxt の Server Actions: 型付きのConnect呼び出し(サーバー登録+クライアント呼び出し、JSONはRS-JSON)"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/Reaxt"

[dependencies]
reaxt = { path = ".." }
# 兄弟ディレクトリ(F:\RS-JSON)。JSONの読み込みは必ず上限つき(from_str_secure)。
rust-json = { path = "../../RS-JSON", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers"] }
js-sys = "0.3"
