[package]
name = "reaxt"
description = "Reaxt: Rust-only full-stack framework (React/Next/Nuxt/Nest ideas) for RPoem + SET. Hybrid SSR/CSR/Islands per route."
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/Reaxt"

[lints.rust]
unsafe_code = "deny"

[dependencies]
rhtml5 = { git = "https://github.com/aon-co-jp/RS-HTML", optional = true }
rcss3 = { git = "https://github.com/aon-co-jp/RS-CSS", optional = true }

[features]
# RS-HTML/RS-CSSのDOM木とVNodeを接続(RS-Reactから引き継いだ任意機能)
dom_bridge = ["dep:rhtml5", "dep:rcss3"]

[workspace]
members = ["reaxt-rpoem", "reaxt-db", "reaxt-actions", "reaxt-cli", "examples/counter", "examples/aruaru-admin"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Window", "EventTarget", "Document", "HtmlElement", "Element", "Node", "NodeList", "Text", "Event", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "EventTarget"] }

# wasmを小さくする(サイズ優先・LTO・panic=abort)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
